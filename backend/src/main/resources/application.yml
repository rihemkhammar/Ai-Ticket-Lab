server:
  port: 8081
app:
  ai:
    provider: openai #or any other AI provider
  jwt:
    secret: "K9x2mL0pQ7rmZ8vN3sT6uR1cB4dE5fG2hJ8kP"
    expiration-ms: 86400000
  # ── RAG retrieval ──────────────────────────────────
  rag:
    top-k: 3
    embedding-dimensions: 1536
    max-chunk-chars: 400
spring:
  application:
    name: genai-java-spring
  # ── DataSource ───────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://localhost:5432/maintenance_ai
    username: maintenance_ai
    password: maintenance_ai
    driver-class-name: org.postgresql.Driver
  # ── JPA ─────────────────────────────────────────────────
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false

  # ── Flyway ──────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
# ── Spring AI ───────────────────────────────────────────

  ai:


    openai:
      api-key: ${OPENAI_API_KEY}
      base-url: https://openrouter.ai/api
      chat:
        options:
          model: openai/gpt-oss-20b #gpt-4o

    embedding:
      base-url: https://api-inference.huggingface.co/v1 #https://api.openai.com
      api-key: ${EMBEDDING_API_KEY} #${EMBEDDING_API_KEY:${OPENAI_API_KEY}}
      options:
        model: sentence-transformers/all-MiniLM-L6-v2 #text-embedding-3-small



# ── Logging ─────────────────────────────────────────────

  logging:
    level:
      root: INFO
      com.genai.java.spring: INFO
      arg.springframwoek.ai: INFO
      org.springframework.security: TRACE
